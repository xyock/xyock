<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d0c"><title>xyock Review</title>
<style>
:root{color-scheme:dark;--bg:#090d0c;--line:#27352e;--text:#e7f0eb;--muted:#93a39a;--accent:#80dfb2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#173127 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:0 auto;padding:38px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border:1px solid #355246;border-radius:13px;background:#11251b;display:grid;place-items:center;color:var(--accent);font-size:21px}.brand h1{font-size:19px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px}.button{border:1px solid var(--line);background:#16211c;color:var(--text);border-radius:10px;padding:9px 13px}.button.primary{border-color:#42765d;background:#183d2d;color:#dff9eb}.status{min-height:20px;margin-top:12px;color:var(--muted);font-size:12px}.login{max-width:420px;margin:12vh auto 0;border:1px solid var(--line);background:rgba(17,25,22,.92);border-radius:20px;padding:28px}.login h2{margin:0 0 6px;font-size:20px}.login p{color:var(--muted);font-size:13px;margin:0 0 20px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:#b4c4bb}.field input,.search{width:100%;border:1px solid var(--line);border-radius:10px;background:#0d1411;color:var(--text);padding:12px}.login .button{width:100%;margin-top:8px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.stat{border:1px solid var(--line);border-radius:14px;padding:17px;background:linear-gradient(145deg,#14211b,#101713)}.stat .label{font-size:12px;color:var(--muted)}.stat .number{font-size:28px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}.toolbar{display:flex;gap:1 </style></head><body><main class="shell">
<header class="top"><div class="brand"><div class="mark">◉</div><div><h1>xyock Review</h1><p>Answer feedback &amp; report center</p></div></div><div class="top-actions hidden" id="topActions"><button class="button" id="refresh">새로고침</button><button class="button" id="logout">로그아웃</button></div></header>
<section class="login" id="loginPanel"><h2>관리자 로그인</h2><p>xyock 계정으로 로그인한 뒤 이메일에서 로그인 요청을 승인해 주세요.</p><form id="loginForm"><div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button primary" id="loginButton" type="submit">로그인 요청</button><div class="status" id="loginStatus" role="status" aria-live="polite"></div></form></section>
<section id="dashboard" class="hidden"><div class="stats"><div class="stat"><div class="label">현재 긍정 평가</div><div class="number" id="upCount">0</div></div><div class="stat"><div class="label">현재 부정 평가</div><div class="number" id="downCount">0</div></div><div class="stat"><div class="label">신고 접수</div><div class="number" id="reportCount">0</div></div><div class="stat"><div class="label">전체 제출 이벤트</div><div class="number" id="allCount">0</div></div></div>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="답변 ID, 사이트, 내용 검색"><div class="filters" id="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="up">엄지 척</button><button class="filter" data-filter="down">엄지 다운</button><button class="filter" data-filter="report">신고</button><button class="filter" data-filter="clear">선택 취소</button></div><button class="button" id="export">CSV 내보내기</button></div><div class="feed" id="feed"><div class="empty">기록을 불러오는 중…</div></div><div class="footer">제출 기록은 Supabase에 저장됩니다. 답변 본문은 최대 4,000자까지 기록합니다.</div></section></main>
<script>
const BASE="https://lhbdijxjnqbzmrvrvrkr.supabase.co",KEY="sb_publishable_e3oKyICzmGvyx1FFcO1dMQ_39veE0G4",FN=BASE+"/functions/v1/",SK="xyock_review_admin_session_v1";let session=null,records=[],filter="all";const $=id=>document.getElementById(id);
function status(t,e){$("loginStatus").textContent=t||"";$("loginStatus").style.color=e?"#ff9b9b":""}function showDash(){$("loginPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");$("topActions").classList.remove("hidden")}function showLogin(){$("loginPanel").classList.remove("hidden");$("dashboard").classList.add("hidden");$("topActions").classList.add("hidden")}function save(){try{sessionStorage.setItem(SK,JSON.stringify(session))}catch(_){}}function restore(){try{session=JSON.parse(sessionStorage.getItem(SK)||"null")}catch(_){session=null}}
async function ensure(){if(!session||!session.access_token)return false;if(Number(session.expires_at)>Math.floor(Date.now()/1000)+90)return true;const r=await fetch(BASE+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({refresh_token:session.refresh_token})}),d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token){session=null;save();return false}session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(Number(d.expires_in)||3600),email:d.user?.email||session.email};save();return true}
async function login(e){e.preventDefault();const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return;$("loginButton").disabled=true;status("로그인 요청을 보내고 있습니다…");try{const r=await fetch(FN+"request-login",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({email,password})}),q=await r.json().catch(()=>({}));if(!r.ok||!q.request_id||!q.poll_token)throw new Error(q.error==="invalid_credentials"?"이메일 또는 비밀번호가 올바르지 않습니다.":q.error||"로그인 요청 실패");status("이메일로 전송된 로그인 승인 링크를 눌러 주세요. 승인 확인 중…");const end=Date.now()+300000;while(Date.now()<end){await new Promise(resolve=>setTimeout(resolve,3000));const p=await fetch(FN+"check-login",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({request_id:q.request_id,poll_token:q.poll_token})}),d=await p.json().catch(()=>({}));if(!p.ok)throw new Error(d.error||"로그인 승인 확인 실패");if(d.status==="approved"){session={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(Number(d.expires_in)||3600),email:d.user?.email||email};save();$("password").value="";await load();return}if(d.status==="rejected")throw new Error("로그인 요청이 거절되었습니다.");if(d.status==="expired")throw new Error("로그인 요청 시간이 만료되었습니다.")}throw new Error("로그인 승인 시간이 만료되었습니다.")}catch(err){status(err.message||"로그인 실패",true)}finally{$("loginButton").disabled=false}}
async function load(){if(!await ensure()){showLogin();return}$("feed").innerHTML='<div class="empty">기록을 불러오는 중…</div>';const r=await fetch(FN+"xyock-review?limit=1000",{headers:{apikey:KEY,Authorization:"Bearer "+session.access_token}}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok){if(r.status===401){session=null;save();showLogin();return}throw new Error(r.status===403?"이 계정에는 검토 페이지 접근 권한이 없습니다.":d.error||"불러오기 실패")}records=Array.isArray(d.items)?d.items:[];counts();render();showDash()}
function key(x){return[x.source_site,x.answer_id,x.visitor_id].join("::")}function counts(){const latest=new Map();records.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(x=>{if(x.feedback_type==="report")return;const k=key(x);if(x.feedback_type==="clear")latest.delete(k);else latest.set(k,x.feedback_type)});let up=0,down=0;for(const v of latest.values()){if(v==="up")up++;if(v==="down")down++}$("upCount").textContent=up.toLocaleString("ko-KR");$("downCount").textContent=down.toLocaleString("ko-KR");$("reportCount").textContent=records.filter(x=>x.feedback_type==="report").length.toLocaleString("ko-KR");$("allCount").textContent=records.length.toLocaleString("ko-KR")}
function label(t){return({up:"엄지 척",down:"엄지 다운",report:"신고",clear:"선택 취소"})[t]||t}
function makeCard(x){const a=document.createElement("article");a.className="item";const h=document.createElement("div");h.className="item-head";const l=document.createElement("div"),m=document.createElement("div");m.className="meta";const p=document.createElement("span");p.className="pill "+x.feedback_type;p.textContent=label(x.feedback_type);const site=document.createElement("span");site.className="site";site.textContent=x.source_site||"사이트 미상";m.append(p,site);const id=document.createElement("div");id.className="answer-id";id.textContent="Answer: "+(x.answer_id||"unknown");l.append(m,id);const time=document.createElement("time");time.className="time";time.textContent=x.created_at?new Date(x.created_at).toLocaleString("ko-KR"):"";h.append(l,time);a.append(h);if(x.feedback_type==="report"){const r=document.createElement("div");r.className="reason";r.textContent="사유: "+(x.category||"기타")+(x.reason?" · "+x.reason:"");a.append(r)}if(x.answer_excerpt){const ex=document.createElement("div");ex.className="excerpt";ex.textContent=x.answer_excerpt;a.append(ex)}if(x.page_url){const links=document.createElement("div");links.className="links";const link=document.createElement("a");link.href=x.page_url;link.target="_blank";link.rel="noopener noreferrer";link.textContent="원본 페이지 열기 ↗";links.append(link);a.append(links)}return a}
function render(){const q=$("search").value.trim().toLowerCase(),list=records.filter(x=>(filter==="all"||x.feedback_type===filter)&&(!q||[x.answer_id,x.source_site,x.feedback_type,x.category,x.reason,x.answer_excerpt,x.page_url].join(" ").toLowerCase().includes(q)));const feed=$("feed");feed.replaceChildren();if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent=records.length?"검색 결과가 없습니다.":"아직 제출된 피드백이 없습니다.";feed.append(e);return}list.forEach(x=>feed.append(makeCard(x)))}
function csv(){const cols=["created_at","source_site","feedback_type","answer_id","category","reason","answer_excerpt","page_url","visitor_id"],q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',text=[cols.join(","),...records.map(x=>cols.map(k=>q(x[k])).join(","))].join("\\r\\n"),blob=new Blob(["\\uFEFF"+text],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="xyock-review-"+new Date().toISOString().slice(0,10)+".csv";a.click();URL.revokeObjectURL(url)}
$("loginForm").addEventListener("submit",login);$("refresh").addEventListener("click",()=>load().catch(e=>alert(e.message)));$("logout").addEventListener("click",()=>{session=null;sessionStorage.removeItem(SK);showLogin()});$("search").addEventListener("input",render);$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;$("filters").querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});$("export").addEventListener("click",csv);restore();if(session)load().catch(e=>{showLogin();status(e.message,true)});else showLogin();
</script></body></html>
